<svg fill="none" width="100%" height="220" viewBox="0 0 940 220" xmlns="http://w3.org">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://w3.org">
      <style>
        @import url('https://googleapis.com');
        
        .skills-container {
          width: 100%;
          padding: 10px;
          box-sizing: border-box;
        }

        .skills-cloud {
          display: flex;
          width: 100%;
          max-width: 940px;
          margin: 0 auto;
          flex-wrap: wrap;
          justify-content: center;
          gap: 12px 14px;
        }

        .skill-pill {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          height: 42px;
          padding: 0 18px;
          border: 2px solid #9da7ec;
          border-radius: 20px;
          background: #e5e8ff;
          color: #2e3142;
          font-family: "Playfair Display", Georgia, Cambria, serif;
          font-size: 14px;
          font-weight: 600;
          letter-spacing: 0.01em;
          white-space: nowrap;
          box-shadow: 0 2px 0 rgba(101, 111, 181, 0.08);
        }
      </style>

      <div class="skills-container">
        <main class="skills-cloud">
          <span class="skill-pill">Python</span>
          <span class="skill-pill">SQL</span>
          <span class="skill-pill">HTML</span>
          <span class="skill-pill">CSS</span>
          <span class="skill-pill">JavaScript</span>
          <span class="skill-pill">Bootstrap</span>
          <span class="skill-pill">React</span>
          <span class="skill-pill">Node.js</span>
          <span class="skill-pill">WordPress</span>
          <span class="skill-pill">Wix</span>
          <span class="skill-pill">Snowflake</span>
          <span class="skill-pill">dbt</span>
          <span class="skill-pill">Azure</span>
          <span class="skill-pill">Vercel</span>
          <span class="skill-pill">Vite</span>
          <span class="skill-pill">Netlify</span>
          <span class="skill-pill">Git/GitHub</span>
          <span class="skill-pill">Figma</span>
          <span class="skill-pill">VS Code</span>
        </main>
      </div>
    </div>
  </foreignObject>
</svg>
