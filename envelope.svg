<svg xmlns="http://w3.org" viewBox="0 0 500 400" width="100%" height="400">
  <defs>
    <!-- Filter to give the wax stamp a soft, realistic 3D shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    <![CDATA[
    /* --- CSS ANIMATION TIMINGS --- */
    .envelope-flap {
      transform-origin: 250px 120px;
      animation: openFlap 6s ease-in-out infinite alternate;
    }
    .wax-stamp {
      transform-origin: 250px 210px;
      animation: breakSeal 6s ease-in-out infinite alternate;
    }
    .letter-card {
      animation: slideLetter 6s ease-in-out infinite alternate;
    }

    /* --- ANIMATION KEYFRAMES --- */
    @keyframes openFlap {
      0%, 15% { transform: scaleY(1); fill: #8fa0e6; }
      40%, 100% { transform: scaleY(-0.9); fill: #7b8ed9; }
    }
    @keyframes breakSeal {
      0%, 10% { transform: scale(1); opacity: 1; }
      30%, 100% { transform: scale(0.9) translateY(40px); opacity: 0; pointer-events: none; }
    }
    @keyframes slideLetter {
      0%, 35% { transform: translateY(80px); opacity: 0; }
      60%, 100% { transform: translateY(-70px); opacity: 1; }
    }
    ]]>
  </style>


  <!-- BACKGROUND/CONTAINER PADDING -->
  <rect width="100%" height="100%" fill="transparent"/>

  <!-- 1. THE LETTER CARD (Slides up from the middle layer) -->
  <g class="letter-card">
    <!-- Paper Card -->
    <rect x="120" y="130" width="260" height="150" rx="4" fill="#ffffff" filter="url(#shadow)"/>
    <!-- Retro Code Text -->
    <text x="250" y="215" 
          font-family="'Courier New', Courier, monospace, Consolas" 
          font-size="24" 
          font-weight="bold" 
          fill="#2b2d42" 
          text-anchor="middle" 
          letter-spacing="1">
      &gt; hello world_
    </text>
  </g>

  <!-- 2. ENVELOPE BACK & SIDES LAYER -->
  <!-- Inner Back Shadow Pocket -->
  <rect x="100" y="120" width="300" height="200" rx="6" fill="#6779cb" />
  
  <!-- Side Triangles (Left and Right Folds) -->
  <path d="M 100 120 L 250 220 L 100 320 Z" fill="#9cb0f8"/>
  <path d="M 400 120 L 250 220 L 400 320 Z" fill="#9cb0f8"/>
  
  <!-- Bottom Triangle Fold -->
  <path d="M 100 320 L 250 210 L 400 320 Z" fill="#a9bcfc"/>

  <!-- 3. ENVELOPE TOP FLAP LAYER (Folds over everything) -->
  <path class="envelope-flap" d="M 100 120 L 250 220 L 400 120 Z" filter="url(#shadow)" />

  <!-- 4. WAX STAMP SEAL LAYER (Melts/drops out of the way) -->
  <g class="wax-stamp" filter="url(#shadow)">
    <!-- Organic Melting Wax Shape -->
    <path d="M 250 185 
             C 270 183, 280 195, 278 210 
             C 276 225, 265 235, 250 233 
             C 232 231, 222 218, 225 205 
             C 228 192, 235 187, 250 185 Z" 
          fill="#b62441" />
    <!-- Inner Stamp Crest Ring -->
    <circle cx="250" cy="210" r="16" fill="none" stroke="#941930" stroke-width="2" stroke-dasharray="2 2"/>
    <!-- Center Letter "H" or Symbol in Stamp -->
    <text x="250" y="216" font-family="serif" font-size="18" font-weight="bold" fill="#941930" text-anchor="middle">⌘</text>
  </g>
</svg>
